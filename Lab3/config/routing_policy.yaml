# Lab 3 — Benchmark-Derived Routing Policy
# Driven by Lab 2 workload benchmarking evidence on order_flow_service
#
# Core Principle:
# Choose the least expensive model that reliably meets the quality bar for the task.

max_attempts: 2

routing_policy:

  implementation:
    primary: claude-3-5-haiku
    fallback: claude-3-5-sonnet

  refactoring:
    primary: claude-3-5-sonnet
    fallback: claude-3-opus

  debugging:
    primary: claude-3-5-sonnet
    fallback: claude-3-opus

  testing:
    primary: claude-3-5-haiku
    fallback: claude-3-5-sonnet